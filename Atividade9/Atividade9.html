<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Atividade 9</h1>

        <section class="card">
            <h2>Maior de três números</h2>
            <label for="n1">Números</label>
            <input type="number" id="n1" placeholder="Número 1">
            <input type="number" id="n2" placeholder="Número 2">
            <input type="number" id="n3" placeholder="Número 3">
            <button id="btnMaior">Descobrir</button>
            <p class="resultado" id="resultadoMaior"></p>
        </section>

        <section class="card">
            <h2>Ordenar três números</h2>
            <input type="number" id="o1" placeholder="Número 1">
            <input type="number" id="o2" placeholder="Número 2">
            <input type="number" id="o3" placeholder="Número 3">
            <button id="btnOrdenar">Ordenar</button>
            <p class="resultado" id="resultadoOrdenar"></p>
        </section>

        <section class="card">
            <h2>Palíndromo</h2>
            <label for="palavraPal">Palavra ou frase</label>
            <input type="text" id="palavraPal" placeholder="Ex.: Arara">
            <button id="btnPal">Verificar</button>
            <p class="resultado" id="resultadoPal"></p>
        </section>

        <section class="card">
            <h2>Subconjunto de palavras</h2>
            <label for="palavra1">Primeira palavra</label>
            <input type="text" id="palavra1" placeholder="Ex.: programação">
            <label for="palavra2">Segunda palavra</label>
            <input type="text" id="palavra2" placeholder="Ex.: programa">
            <button id="btnSubconjunto">Verificar</button>
            <p class="resultado" id="resultadoSubconjunto"></p>
        </section>

        <section class="card">
            <h2>Dia da semana</h2>
            <label for="data">Data (dd/mm/aaaa)</label>
            <input type="text" id="data" placeholder="Ex.: 10/11/2026">
            <button id="btnDia">Descobrir</button>
            <p class="resultado" id="resultadoDia"></p>
        </section>
    </main>

    <script src="Atividade9.js"></script>
</body>
</html>
